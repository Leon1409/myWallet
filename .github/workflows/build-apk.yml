# Buduje APK (debug, sideload — bez sklepu) z builda Vite opakowanego w
# Capacitor. Uruchamia się przy zmianach apki/klienta + ręcznie (workflow_dispatch).
# Wynik: GitHub Release z MyWallet.apk (publiczny URL dla banera aktualizacji
# w apce: releases/latest/download/MyWallet.apk) + artifact dla wygody.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # publikacja release z APK

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Wersja addonu = źródło prawdy (serwer ją zgłasza przez /api/version,
      # apka porównuje i pokazuje baner aktualizacji)
      - name: Wersja aplikacji
        run: |
          VER=$(grep '^version:' ../addon/config.yaml | awk '{print $2}' | tr -d '"')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      # Natywna apka nie ma serwera lokalnego — API przez tunel/domenę
      - name: Build web (Vite, absolutny URL API + wersja)
        run: |
          npm ci
          VITE_API_URL=https://wallet.lukleo.pl/api VITE_APP_VERSION=$APP_VERSION npm run build

      - name: Sync Capacitor (skopiuj dist do projektu Android)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8.x kompiluje @capacitor/android z source/target 21 — JDK 17 pada "invalid source release: 21"
          java-version: 21

      # SDK Android jest preinstalowane na ubuntu-latest (ANDROID_HOME) — bez setup-android

      - name: Assemble debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Zmień nazwę APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk MyWallet.apk

      # Publiczny release — stały URL "latest" dla banera aktualizacji w apce
      - name: Publikuj release z APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.APP_VERSION }}-${{ github.sha }}
          name: MyWallet ${{ env.APP_VERSION }} (APK)
          body: Sideload APK — instalacja ręczna (bez sklepu). Build z ${{ github.sha }}.
          files: client/MyWallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mywallet-apk
          path: client/MyWallet.apk
          retention-days: 90
